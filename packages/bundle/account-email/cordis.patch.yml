# Email one-time-code sign-in, layered over the shipped Web composition.
#
# Two upstream rows implement the browser round trip this deployment cannot
# use, so they are switched off by id instead of edited — the composed profile
# changes and no upstream file does:
#
#   `deepseek-account`      the Platform-backed account provider, which reaches
#                           an origin outside this network.
#   `ui-settings-account`   the Settings card that drives that provider, along
#                           with the sidebar launcher and onboarding surface it
#                           registers. Losing its balance and top-up entries is
#                           intended: this deployment has no wallet.
#
# What replaces them is inserted here: the account provider that answers the
# same `deepseekAccount` contract from a stored email grant, the Remote
# controller owning the two sign-in steps, and the Settings card that drives
# them.

- id: deepseek-account
  disabled: true

- id: ui-settings-account
  disabled: true

- insert:
    # The account provider: identity and expiry come from the claims the issuer
    # minted at sign-in, so every read after sign-in is local.
    - id: email-code-account
      name: '@deepseek-ai/dsh-email-code-account'

    # The two sign-in steps the card calls. `/controller` is the Host-side
    # controller module; the package's `/remote` export is the browser
    # contribution, mounted through the api-remotes assembly instead.
    - id: email-login-controller
      name: '@deepseek-ai/dsh-email-code-account/controller'

    # The Settings card itself.
    - id: ui-account-email
      name: '@deepseek-ai/dsh-client-ui-account-email'
